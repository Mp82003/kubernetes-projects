replicaCount: 2

image:
  repository: nodejs-production
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

config:
  appName: "Node.js Production App"
  environment: "development"

secret:
  databasePassword: "demo-password"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nameOverride: ""
fullnameOverride: ""
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: true
  className: nginx
  host: nodejs-production.local
