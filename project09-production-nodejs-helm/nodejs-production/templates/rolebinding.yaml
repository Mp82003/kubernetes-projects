apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodejs-production.fullname" . }}
  labels:
    {{- include "nodejs-production.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nodejs-production.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "nodejs-production.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
