apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodejs-production.fullname" . }}
  labels:
    {{- include "nodejs-production.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "nodejs-production.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "nodejs-production.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "nodejs-production.fullname" . }}

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nodejs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nodejs-production.fullname" . }}
                  key: APP_NAME

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nodejs-production.fullname" . }}
                  key: NODE_ENV

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodejs-production.fullname" . }}
                  key: DATABASE_PASSWORD

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: app-storage
              mountPath: /app/data

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: {{ include "nodejs-production.fullname" . }}
